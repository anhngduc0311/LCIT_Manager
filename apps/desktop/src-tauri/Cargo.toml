[package]
name = "lcit-manager-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "=2.8.0"
serde = { version = "1", features = ["derive"] }
portable-pty = "0.9"

[target.'cfg(windows)'.dependencies]
flate2 = "1"
sha2 = "0.10"
tar = "0.4"
tauri-plugin-single-instance = "2"
tempfile = "3"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
